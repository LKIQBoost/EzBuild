[project]
name = "ezbuild"
version = "0.1.0"
description = "Minecraft 建筑文件格式转换工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "nbtlib>=2.0.4",
    "pyfiglet>=1.0.4",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
ezbuild = "main:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
